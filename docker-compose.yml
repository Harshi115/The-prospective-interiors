version: '3.8'

services:
  # Strapi CMS
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: tpi-strapi
    restart: unless-stopped
    env_file: ./cms/.env
    environment:
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
      NODE_ENV: production
    volumes:
      # Persist the SQLite database and uploaded media across container restarts/rebuilds.
      # (Do NOT bind-mount the whole ./cms folder here -- that's a dev-only pattern that
      # would overwrite the production build baked into the image at build time.)
      - cms-data:/app/.tmp
      - cms-uploads:/app/public/uploads
    ports:
      - '1337:1337'
    networks:
      - tpi-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tpi-frontend
    restart: unless-stopped
    environment:
      STRAPI_INTERNAL_URL: http://cms:1337
      # Replace with your VPS's public domain or IP so the browser can reach Strapi
      # for images/API calls -- localhost only works when browsing from the server itself.
      NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
    ports:
      - '3000:3000'
    depends_on:
      - cms
    networks:
      - tpi-network

networks:
  tpi-network:
    driver: bridge

volumes:
  cms-data:
  cms-uploads: