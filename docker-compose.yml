version: '3.8'

services:
  # Strapi CMS
  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
    container_name: tpi-strapi
    restart: unless-stopped
    env_file: ./strapi/.env
    environment:
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
      NODE_ENV: development
    volumes:
      - ./strapi:/app
      - /app/node_modules
      - strapi-uploads:/app/public/uploads
    ports:
      - '1337:1337'
    networks:
      - tpi-network

  # Next.js Frontend
  nextjs:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: tpi-frontend
    restart: unless-stopped
    environment:
      STRAPI_INTERNAL_URL: http://strapi:1337
      NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
    ports:
      - '3000:3000'
    depends_on:
      - strapi
    networks:
      - tpi-network

volumes:
  strapi-uploads:

networks:
  tpi-network:
    driver: bridge